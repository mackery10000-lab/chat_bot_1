<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>운행 종료 불가 · NO LAST STOP</title>
  <link rel="stylesheet" href="{{ asset_url('assets/start/style.css') }}">
  <link rel="stylesheet" href="{{ asset_url('assets/start/entry-art.css') }}">
</head>
<body>
  <div class="screen">

    <!-- 천장 등 3개: 꺼짐 / 깜박임 / 켜짐 (옛 객차의 둥근 유리 천장등) -->
    <div class="ceiling" aria-hidden="true">
      <div class="lamp lamp--off">
        <img class="lamp__art" src="{{ asset_url('assets/start/images/entry-lamp.png') }}" alt="" width="1024" height="768">
        <span class="lamp__emission"><span class="lamp__glass-light"></span><span class="lamp__bloom"></span><span class="lamp__spill"></span></span>
      </div>
      <div class="lamp lamp--flicker">
        <img class="lamp__art" src="{{ asset_url('assets/start/images/entry-lamp.png') }}" alt="" width="1024" height="768">
        <span class="lamp__emission fx"><span class="lamp__glass-light"></span><span class="lamp__bloom"></span><span class="lamp__spill"></span></span>
      </div>
      <div class="lamp lamp--on">
        <img class="lamp__art" src="{{ asset_url('assets/start/images/entry-lamp.png') }}" alt="" width="1024" height="768">
        <span class="lamp__emission"><span class="lamp__glass-light"></span><span class="lamp__bloom"></span><span class="lamp__spill"></span></span>
      </div>
    </div>

    <!-- 우측 상단 버튼 -->
    <div class="top-actions">
      <button class="icon-btn" type="button" aria-label="배경음악 끄기" aria-pressed="false" data-bgm-toggle>
        <img src="{{ asset_url('assets/start/images/entry-sound.png') }}" width="44" height="44" alt="" draggable="false">
      </button>
      <button class="icon-btn" type="button" aria-label="환경 설정" aria-haspopup="dialog" id="settingsBtn">
        <img src="{{ asset_url('assets/start/images/entry-settings.png') }}" width="44" height="44" alt="" draggable="false">
      </button>
    </div>

    <main class="main">

      <!-- 철도역 간판 = 게임 제목 -->
      <div class="sign" data-phase="level" data-angle="0">
        <div class="sign__chains" aria-hidden="true">
          <svg class="sign__rigging" viewBox="0 0 760 100" preserveAspectRatio="none">
            <defs><linearGradient id="cord-brass" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="70"><stop stop-color="#715232"/><stop offset=".45" stop-color="#b99a62"/><stop offset=".7" stop-color="#947346"/><stop offset="1" stop-color="#594027"/></linearGradient></defs>
            <path class="sign__cord sign__cord--left" d="M121.6 0 Q121.6 15 121.6 35"/>
            <path class="sign__cord sign__cord--right" d="M638.4 0 Q638.4 15 638.4 35"/>
            <path class="sign__fray" d=""/>
            <path class="sign__fray" d=""/>
            <path class="sign__fray" d=""/>
          </svg>
        </div>
        <div class="sign__frame concave-all">
          <div class="sign__inner concave-all">
            <div class="sign__board">
              <!-- 오목한 모서리를 따라가는 금색 테두리 두 줄 -->
              <span class="sign__line sign__line--gold1 concave-top" aria-hidden="true"></span>
              <span class="sign__line sign__line--fill1 concave-top" aria-hidden="true"></span>
              <span class="sign__line sign__line--gold2 concave-top" aria-hidden="true"></span>
              <span class="sign__line sign__line--fill2 concave-top" aria-hidden="true"></span>
              <!-- 낡은 느낌: 벗겨진 칠·긁힌 자국 -->
              <span class="sign__wear sign__wear--chips" aria-hidden="true"></span>
              <h1 class="sign__title">
                <img class="sign__title-logo" src="{{ asset_url('assets/start/images/title-logo.webp') }}" width="1264" height="599" alt="운행 종료 불가" draggable="false">
              </h1>
            </div>
            <div class="sign__strip">
              <span class="neon fx">전역 출발</span>
              <span class="sign__divider" aria-hidden="true"></span>
              <div class="ticker">
                <div class="ticker__track fx">
                  <span>다음 정차역은 알 수 없습니다 · 이상한 점을 발견하면 되돌아가십시오 · 이상이 없으면 계속 가십시오</span>
                  <span aria-hidden="true">다음 정차역은 알 수 없습니다 · 이상한 점을 발견하면 되돌아가십시오 · 이상이 없으면 계속 가십시오</span>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- 나레이션 (타자 효과) -->
      <p class="narration">
        <span class="sr-only" id="narration-full"></span>
        <span aria-hidden="true"><span id="line1"></span><br><span id="line2"></span><span class="caret fx"></span></span>
      </p>

      <!-- 승차권 버튼 -->
      <div class="cta">
        <!-- 승차권 이미지가 곧 탑승 버튼 -->
        <a class="boarding-pass" href="{{ url_for('detail') }}" aria-label="탑승하기 · 01호차 · 좌석 08C">
          <img src="{{ asset_url('assets/start/images/entry-boarding-ticket.png') }}" width="1200" height="417" alt="13-Fri 열차 승차권. 01호차, 좌석 08C. 서울역 출발, 도착역은 얼룩으로 지워짐">
          <span class="boarding-pass__hint" aria-hidden="true">탑승하기 ›</span>
        </a>
      </div>

    </main>

  </div>

  <!-- 환경 설정 창 -->
  <dialog class="settings" id="settingsDialog" aria-labelledby="setTitle">
    <form method="dialog" class="settings__card">
      <div class="settings__head">
        <div class="settings__titles">
          <span class="settings__en">SETTINGS</span>
          <h2 id="setTitle" class="settings__title">환경 설정</h2>
        </div>
        <button class="settings__close" value="close" aria-label="닫기">
          <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12"/><path d="M18 6L6 18"/></svg>
        </button>
      </div>
      <hr class="settings__rule">

      <div class="settings__row">
        <div class="settings__label-line"><label for="setBgm">배경음악</label><output id="bgmOut" for="setBgm">70</output></div>
        <input id="setBgm" class="set-range" type="range" min="0" max="100" value="70">
      </div>

      <div class="settings__row">
        <div class="settings__label-line"><label for="setSfx">효과음</label><output id="sfxOut" for="setSfx">60</output></div>
        <input id="setSfx" class="set-range" type="range" min="0" max="100" value="60">
      </div>

      <div class="settings__row">
        <span id="speedLabel" class="settings__label">글자 속도</span>
        <div class="seg-group" role="group" aria-labelledby="speedLabel">
          <button type="button" class="seg" data-speed="slow" aria-pressed="false">느리게</button>
          <button type="button" class="seg" data-speed="normal" aria-pressed="true">보통</button>
          <button type="button" class="seg" data-speed="fast" aria-pressed="false">빠르게</button>
        </div>
      </div>

      <div class="settings__row settings__row--inline">
        <div class="settings__titles">
          <label for="setFx" class="settings__label">화면 효과</label>
          <span class="settings__hint">조명 깜박임, 간판 흔들림 같은 연출</span>
        </div>
        <input id="setFx" class="switch" type="checkbox" checked>
      </div>

      <hr class="settings__rule">
      <div class="settings__foot">
        <button type="button" class="settings__reset" id="resetSettings">기본값으로</button>
        <button class="settings__ok" value="ok">확인</button>
      </div>
    </form>
  </dialog>

  <script src="{{ asset_url('assets/js/audio.js') }}"></script>
  <script src="{{ asset_url('assets/start/settings.js') }}"></script>
  <script src="{{ asset_url('assets/start/entry-motion.js') }}"></script>
  <script src="{{ asset_url('assets/start/script.js') }}"></script>
</body>
</html>
